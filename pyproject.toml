[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cardio-safety-eval"
version = "0.1.0"
description = "Synthetic red-flag escalation tests for cardiovascular health chatbots"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "ChatDok GmbH", email = "hello@chatdok.com" }]
keywords = ["cardiology", "llm-evaluation", "patient-safety", "triage", "chatbot"]

[project.urls]
Homepage = "https://github.com/chatdok-health/cardio-safety-eval"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["cardio_safety_eval"]
